name: ROS2 Colcon Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Source ROS 2 Jazzy environment
        run: |
          source /opt/ros/jazzy/setup.bash

      - name: Install OS dependencies with rosdep
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -iry

      - name: Build workspace with colcon
        run: |
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Source built workspace
        run: |
          source install/setup.bash

      - name: Run tests
        if: always()
        run: |
          colcon test --packages-select ap1_planning control
          colcon test-result --verbose

